name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: SPA deep-link fallback (404.html)
        run: cp dist/index.html dist/404.html

      # The printed QR code at dr-xas.org/go must never change. These checks
      # fail the deploy rather than silently shipping a broken redirect page —
      # see the migration plan's "/go/ contract" section.
      - name: Verify the /go/ contract
        run: |
          diff -q public/go/index.html dist/go/index.html
          test -f dist/go/target.json
          test -f dist/CNAME
          test -f dist/drxas_logo_small.png

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
